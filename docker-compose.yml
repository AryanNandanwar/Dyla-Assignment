services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 2s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - max_connections=200

  seller-1: &seller
    build: .
    environment:
      DATABASE_URL: postgres://tickets:tickets@postgres:5432/tickets
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  seller-2:
    <<: *seller

  seller-3:
    <<: *seller

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - seller-1
      - seller-2
      - seller-3
