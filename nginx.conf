events {
  worker_connections 4096;
}

http {
  upstream sellers {
    least_conn;
    server seller-1:3000;
    server seller-2:3000;
    server seller-3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_pass http://sellers;
    }
  }
}
